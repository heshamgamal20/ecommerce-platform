[program:ecommerce-worker]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/ecommerce-platform
command=/usr/bin/php artisan queue:work redis --queue=default --sleep=3 --tries=3 --timeout=90 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/ecommerce-worker.log
stopwaitsecs=3600
user=www-data
